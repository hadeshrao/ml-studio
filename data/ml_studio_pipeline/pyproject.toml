
[tool.kedro]
package_name = "ml_studio_pipeline"
project_name = "ml_studio_pipeline"
kedro_init_version = "0.19.0"

[project]
name = "ml_studio_pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kedro>=0.19.0",
    "pandas",
    "scikit-learn",
    "numpy",
    
]

[project.optional-dependencies]
dev = [
    "kedro-datasets[pandas.CSVDataset,pickle.PickleDataset]>=3.0.0",
    "ipython",
    "notebook",
]
